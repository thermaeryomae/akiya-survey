<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>空き家調査アプリ（プロトタイプ）</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{
    --rank-a:#4caf50;
    --rank-b:#ffc107;
    --rank-c:#ff9800;
    --rank-d:#e53935;
    --bg:#f4f5f7;
    --card:#ffffff;
    --text:#222;
    --sub:#666;
    --accent:#2f6f4f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:var(--text);}
  #app{position:fixed;inset:0;display:flex;flex-direction:column;}

  header{
    background:var(--accent);color:#fff;padding:10px 14px;
    display:flex;align-items:center;justify-content:space-between;
    z-index:1000;box-shadow:0 2px 6px rgba(0,0,0,.15);
  }
  header h1{font-size:16px;margin:0;font-weight:600;}
  .tabbtns{display:flex;gap:6px;}
  .tabbtn{
    background:rgba(255,255,255,.15);border:none;color:#fff;padding:6px 12px;
    border-radius:20px;font-size:13px;cursor:pointer;
  }
  .tabbtn.active{background:#fff;color:var(--accent);font-weight:600;}

  #mapview{flex:1;position:relative;display:none;}
  #mapview.active{display:block;}
  #map{position:absolute;inset:0;}

  .hint{
    position:absolute;top:10px;left:50%;transform:translateX(-50%);
    background:rgba(0,0,0,.72);color:#fff;padding:8px 14px;border-radius:20px;
    font-size:12.5px;z-index:900;pointer-events:none;white-space:nowrap;
  }

  .fab{
    position:absolute;right:16px;bottom:20px;z-index:900;
    background:var(--accent);color:#fff;border:none;border-radius:50%;
    width:56px;height:56px;font-size:26px;box-shadow:0 3px 10px rgba(0,0,0,.3);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .fab:active{transform:scale(.95);}

  #listview{flex:1;overflow-y:auto;display:none;padding:12px;}
  #listview.active{display:block;}
  .empty{color:var(--sub);text-align:center;margin-top:60px;font-size:14px;line-height:1.8;}

  .record{
    background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:10px;
    box-shadow:0 1px 3px rgba(0,0,0,.08);display:flex;gap:10px;cursor:pointer;
  }
  .record .thumb{
    width:56px;height:56px;border-radius:8px;background:#ddd;flex-shrink:0;
    background-size:cover;background-position:center;
    display:flex;align-items:center;justify-content:center;font-size:22px;color:#999;
  }
  .record .info{flex:1;min-width:0;}
  .record .addr{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .record .meta{font-size:12.5px;color:var(--sub);margin-top:2px;}
  .rankchip{
    display:inline-block;padding:2px 8px;border-radius:10px;color:#fff;font-size:11px;
    font-weight:600;margin-right:6px;
  }

  .sheet-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:2000;
    display:none;align-items:flex-end;
  }
  .sheet-overlay.active{display:flex;}
  .sheet{
    background:#fff;width:100%;max-height:88vh;overflow-y:auto;
    border-radius:18px 18px 0 0;padding:16px 18px 28px;
  }
  .sheet-handle{width:40px;height:4px;background:#ddd;border-radius:2px;margin:0 auto 12px;}
  .sheet h2{font-size:17px;margin:0 0 14px;}

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;color:var(--sub);margin-bottom:5px;font-weight:600;}
  .field input[type=text], .field input[type=date], .field textarea, .field select{
    width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:10px;
    font-size:15px;background:#fafafa;font-family:inherit;
  }
  .field textarea{resize:vertical;min-height:56px;}

  .segbtns{display:flex;gap:6px;flex-wrap:wrap;}
  .segbtn{
    flex:1;min-width:64px;padding:9px 6px;border:1.5px solid #ddd;border-radius:10px;
    background:#fafafa;font-size:13px;text-align:center;cursor:pointer;color:#555;
  }
  .segbtn.selected{border-color:var(--accent);background:var(--accent);color:#fff;font-weight:600;}

  .rankbtns .segbtn[data-v="A"].selected{background:var(--rank-a);border-color:var(--rank-a);}
  .rankbtns .segbtn[data-v="B"].selected{background:var(--rank-b);border-color:var(--rank-b);color:#333;}
  .rankbtns .segbtn[data-v="C"].selected{background:var(--rank-c);border-color:var(--rank-c);}
  .rankbtns .segbtn[data-v="D"].selected{background:var(--rank-d);border-color:var(--rank-d);}

  .photo-row{display:flex;gap:10px;align-items:center;}
  .photo-preview{
    width:72px;height:72px;border-radius:10px;background:#eee;background-size:cover;
    background-position:center;flex-shrink:0;display:flex;align-items:center;
    justify-content:center;color:#999;font-size:24px;border:1px dashed #ccc;
  }
  .photo-btn{
    padding:9px 14px;border:1.5px solid var(--accent);color:var(--accent);
    border-radius:10px;background:#fff;font-size:13.5px;cursor:pointer;
  }

  .sheet-actions{display:flex;gap:10px;margin-top:18px;}
  .btn{
    flex:1;padding:13px;border-radius:12px;border:none;font-size:15px;font-weight:600;cursor:pointer;
  }
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-ghost{background:#f0f0f0;color:#555;}
  .btn-danger{background:#fdeaea;color:#c0392b;}

  .coord-note{font-size:11.5px;color:var(--sub);margin-top:-6px;margin-bottom:14px;}

  .leaflet-div-icon{background:transparent;border:none;}
  .pin{
    width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);
    border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);
  }
  .pin.A{background:var(--rank-a);} .pin.B{background:var(--rank-b);}
  .pin.C{background:var(--rank-c);} .pin.D{background:var(--rank-d);}
  .pin.new{background:#888;}

  #toolbar{
    display:flex;gap:8px;padding:8px 12px;background:#fff;border-top:1px solid #eee;
    z-index:900;
  }
  #toolbar button{
    flex:1;padding:9px;font-size:12.5px;border-radius:10px;border:1px solid #ddd;
    background:#fafafa;color:#555;
  }

  /* 特定空家等 判定チェックリスト */
  .tokutei-btn{
    width:100%;padding:12px;border-radius:12px;border:1.5px dashed var(--accent);
    background:#f2f8f5;color:var(--accent);font-size:14px;font-weight:600;cursor:pointer;
    margin-bottom:14px;text-align:left;display:flex;align-items:center;justify-content:space-between;
  }
  .tokutei-summary-badge{
    font-size:11.5px;padding:3px 9px;border-radius:10px;font-weight:600;
  }
  .tokutei-summary-badge.none{background:#eee;color:#888;}
  .tokutei-summary-badge.hit{background:#e53935;color:#fff;}
  .tokutei-summary-badge.clear{background:#4caf50;color:#fff;}

  #tokuteiOverlay{
    position:fixed;inset:0;background:#fff;z-index:3000;display:none;flex-direction:column;
  }
  #tokuteiOverlay.active{display:flex;}
  .tk-header{
    background:var(--accent);color:#fff;padding:12px 14px;display:flex;align-items:center;
    justify-content:space-between;flex-shrink:0;
  }
  .tk-header h2{font-size:15px;margin:0;}
  .tk-header button{
    background:rgba(255,255,255,.2);border:none;color:#fff;padding:7px 14px;border-radius:16px;font-size:13px;
  }
  .tk-body{flex:1;overflow-y:auto;padding:10px 12px 100px;}
  .tk-note{
    background:#fff8e1;border:1px solid #ffe082;border-radius:10px;padding:10px 12px;
    font-size:12px;color:#7a5c00;margin-bottom:14px;line-height:1.6;
  }
  .tk-category{
    margin-bottom:16px;border-radius:12px;overflow:hidden;border:1px solid #e5e5e5;
  }
  .tk-cat-head{
    background:#f0f0f0;padding:10px 12px;font-weight:700;font-size:13.5px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .tk-cat-result{font-size:11px;padding:2px 8px;border-radius:8px;background:#ddd;color:#666;}
  .tk-cat-result.hit{background:#e53935;color:#fff;}
  .tk-group{border-top:1px solid #eee;}
  .tk-group-head{
    padding:9px 12px;font-size:12.5px;font-weight:600;color:#444;background:#fafafa;
    display:flex;align-items:center;justify-content:between;gap:6px;cursor:pointer;
  }
  .tk-group-head .chev{margin-left:auto;color:#999;font-size:11px;}
  .tk-group-body{padding:2px 10px 8px;display:none;}
  .tk-group-body.open{display:block;}
  .tk-item{
    display:flex;align-items:flex-start;gap:8px;padding:8px 2px;border-bottom:1px dashed #eee;font-size:12.8px;
  }
  .tk-item:last-child{border-bottom:none;}
  .tk-item .tk-text{flex:1;line-height:1.5;color:#333;}
  .tk-item .tk-checks{display:flex;flex-direction:column;gap:3px;flex-shrink:0;align-items:center;}
  .tk-item .tk-checks label{font-size:9.5px;color:#999;display:flex;flex-direction:column;align-items:center;gap:2px;}
  .tk-item input[type=checkbox]{width:19px;height:19px;}
  .tk-footer{
    position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #eee;
    padding:10px 14px;display:flex;gap:10px;
  }
</style>
</head>
<body>
<div id="app">

  <header>
    <h1>🏚 空き家調査</h1>
    <div class="tabbtns">
      <button class="tabbtn active" data-tab="map">地図</button>
      <button class="tabbtn" data-tab="list">一覧</button>
    </div>
  </header>

  <div id="mapview" class="active">
    <div id="map"></div>
    <div class="hint" id="hint">地図をタップして調査地点を追加</div>
    <button class="fab" id="locateBtn" title="現在地へ移動">📍</button>
  </div>

  <div id="listview">
    <div id="listContent"></div>
  </div>

  <div id="toolbar">
    <button id="exportBtn">CSV出力</button>
    <button id="clearBtn">全件削除</button>
    <span style="flex:1;text-align:center;align-self:center;font-size:12px;color:#888;" id="countLabel">0件</span>
  </div>

</div>

<div class="sheet-overlay" id="sheetOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2 id="sheetTitle">調査地点の登録</h2>
    <div class="coord-note" id="coordNote"></div>

    <div class="field">
      <label>住所・目印</label>
      <input type="text" id="f_address" placeholder="例：〇〇町3丁目付近、△△の隣">
    </div>

    <div class="field">
      <label>建物用途</label>
      <div class="segbtns" id="f_type">
        <div class="segbtn" data-v="戸建て">戸建て</div>
        <div class="segbtn" data-v="共同住宅">共同住宅</div>
        <div class="segbtn" data-v="店舗">店舗</div>
        <div class="segbtn" data-v="その他">その他</div>
      </div>
    </div>

    <div class="field">
      <label>老朽度・危険度ランク</label>
      <div class="segbtns rankbtns" id="f_rank">
        <div class="segbtn" data-v="A">A 良好</div>
        <div class="segbtn" data-v="B">B 要観察</div>
        <div class="segbtn" data-v="C">C 要注意</div>
        <div class="segbtn" data-v="D">D 危険</div>
      </div>
    </div>

    <div class="field">
      <label>管理状況</label>
      <div class="segbtns" id="f_mgmt">
        <div class="segbtn" data-v="良好">良好</div>
        <div class="segbtn" data-v="不十分">不十分</div>
        <div class="segbtn" data-v="放置">放置</div>
      </div>
    </div>

    <div class="field">
      <label>空き家推定期間</label>
      <select id="f_period">
        <option value="">選択してください</option>
        <option>1年未満</option>
        <option>1〜3年</option>
        <option>3〜5年</option>
        <option>5〜10年</option>
        <option>10年以上</option>
        <option>不明</option>
      </select>
    </div>

    <div class="field">
      <label>特定空家等への該当可能性</label>
      <div class="segbtns" id="f_special">
        <div class="segbtn" data-v="該当しそう">該当しそう</div>
        <div class="segbtn" data-v="不明">不明</div>
        <div class="segbtn" data-v="該当しなさそう">該当しなさそう</div>
      </div>
    </div>

    <div class="field">
      <label>写真</label>
      <div class="photo-row">
        <div class="photo-preview" id="photoPreview">📷</div>
        <label class="photo-btn">
          撮影・選択
          <input type="file" accept="image/*" capture="environment" id="f_photo" style="display:none;">
        </label>
      </div>
    </div>

    <div class="field">
      <label>調査日</label>
      <input type="date" id="f_date">
    </div>

    <div class="field">
      <label>備考</label>
      <textarea id="f_notes" placeholder="気になった点など自由に"></textarea>
    </div>

    <button type="button" class="tokutei-btn" id="openTokuteiBtn">
      <span>📋 特定空家等 判定チェックリスト</span>
      <span class="tokutei-summary-badge none" id="tokuteiSummaryBadge">未実施</span>
    </button>

    <div class="sheet-actions">
      <button class="btn btn-ghost" id="cancelBtn">キャンセル</button>
      <button class="btn btn-danger" id="deleteBtn" style="display:none;">削除</button>
      <button class="btn btn-primary" id="saveBtn">保存</button>
    </div>
  </div>
</div>

<div id="tokuteiOverlay">
  <div class="tk-header">
    <h2>特定空家等 判定チェックリスト</h2>
    <button id="tokuteiCloseX">閉じる</button>
  </div>
  <div class="tk-body">
    <div class="tk-note">
      国交省ガイドライン（埼玉県空き家対策連絡会議「特定空家等判定方法マニュアル」）に基づく参考チェックリストです。①該当する項目にチェック→②周辺への影響・危険の切迫性がある項目にもチェックが入ると、その区分が「特定空家等相当」と判定されます（別紙３(1)のみ①のみで判定）。<br>
      <strong>これはあくまで参考判定です。実際の特定空家等の認定は市町村が行います。</strong>
    </div>
    <div id="tokuteiCategories"></div>
  </div>
  <div class="tk-footer">
    <button class="btn btn-ghost" id="tokuteiCancelBtn" style="flex:1;">キャンセル</button>
    <button class="btn btn-primary" id="tokuteiApplyBtn" style="flex:2;">この内容を反映する</button>
  </div>
</div>

<script>
const STORAGE_KEY = 'akiya_survey_records_v1';
let records = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
let map, markersLayer;
let pendingLatLng = null;
let editingId = null;
let photoDataUrl = null;

function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(records)); }

function initMap(){
  map = L.map('map', {zoomControl:true}).setView([34.7517, 134.3969], 14); // 赤穂市付近を初期表示
  L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', {
    attribution: '地図: <a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">国土地理院</a>',
    maxZoom: 18
  }).addTo(map);
  markersLayer = L.layerGroup().addTo(map);

  map.on('click', (e) => {
    openSheet(e.latlng, null);
  });

  renderMarkers();
}

function pinIcon(rank){
  const cls = rank ? rank : 'new';
  return L.divIcon({ className:'leaflet-div-icon', html:`<div class="pin ${cls}"></div>`, iconSize:[26,26], iconAnchor:[13,26] });
}

function renderMarkers(){
  markersLayer.clearLayers();
  records.forEach(r => {
    const m = L.marker([r.lat, r.lng], {icon: pinIcon(r.rank)});
    m.on('click', () => openSheet({lat:r.lat, lng:r.lng}, r));
    m.addTo(markersLayer);
  });
}

function segSetup(containerId){
  const el = document.getElementById(containerId);
  el.querySelectorAll('.segbtn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const already = btn.classList.contains('selected');
      el.querySelectorAll('.segbtn').forEach(b=>b.classList.remove('selected'));
      if(!already) btn.classList.add('selected');
    });
  });
}
['f_type','f_rank','f_mgmt','f_special'].forEach(segSetup);

function segValue(containerId){
  const el = document.getElementById(containerId).querySelector('.selected');
  return el ? el.dataset.v : '';
}
function segSet(containerId, value){
  const el = document.getElementById(containerId);
  el.querySelectorAll('.segbtn').forEach(b=>b.classList.toggle('selected', b.dataset.v===value));
}

document.getElementById('f_photo').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    const img = new Image();
    img.onload = function(){
      const canvas = document.createElement('canvas');
      const maxW = 800;
      const scale = Math.min(1, maxW / img.width);
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      photoDataUrl = canvas.toDataURL('image/jpeg', 0.7);
      document.getElementById('photoPreview').style.backgroundImage = `url(${photoDataUrl})`;
      document.getElementById('photoPreview').textContent = '';
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

function openSheet(latlng, record){
  pendingLatLng = latlng;
  editingId = record ? record.id : null;
  photoDataUrl = record ? (record.photo || null) : null;

  document.getElementById('sheetTitle').textContent = record ? '調査地点の編集' : '調査地点の登録';
  document.getElementById('coordNote').textContent = `緯度経度: ${latlng.lat.toFixed(6)}, ${latlng.lng.toFixed(6)}`;
  document.getElementById('f_address').value = record ? record.address||'' : '';
  document.getElementById('f_period').value = record ? record.period||'' : '';
  document.getElementById('f_notes').value = record ? record.notes||'' : '';
  document.getElementById('f_date').value = record ? record.date||todayStr() : todayStr();
  segSet('f_type', record ? record.type||'' : '');
  segSet('f_rank', record ? record.rank||'' : '');
  segSet('f_mgmt', record ? record.mgmt||'' : '');
  segSet('f_special', record ? record.special||'' : '');

  const preview = document.getElementById('photoPreview');
  if(photoDataUrl){ preview.style.backgroundImage = `url(${photoDataUrl})`; preview.textContent=''; }
  else { preview.style.backgroundImage = ''; preview.textContent = '📷'; }

  document.getElementById('deleteBtn').style.display = record ? 'block' : 'none';

  pendingTokutei = record ? (record.tokutei || null) : null;
  updateTokuteiBadge();

  document.getElementById('sheetOverlay').classList.add('active');
}
function closeSheet(){
  document.getElementById('sheetOverlay').classList.remove('active');
  document.getElementById('f_photo').value = '';
}
function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

document.getElementById('cancelBtn').addEventListener('click', closeSheet);
document.getElementById('sheetOverlay').addEventListener('click', (e)=>{ if(e.target.id==='sheetOverlay') closeSheet(); });

document.getElementById('saveBtn').addEventListener('click', ()=>{
  const rec = {
    id: editingId || (Date.now()+'_'+Math.random().toString(36).slice(2,7)),
    lat: pendingLatLng.lat, lng: pendingLatLng.lng,
    address: document.getElementById('f_address').value,
    type: segValue('f_type'),
    rank: segValue('f_rank'),
    mgmt: segValue('f_mgmt'),
    period: document.getElementById('f_period').value,
    special: segValue('f_special'),
    photo: photoDataUrl,
    date: document.getElementById('f_date').value,
    notes: document.getElementById('f_notes').value,
    tokutei: pendingTokutei,
  };
  if(editingId){
    const idx = records.findIndex(r=>r.id===editingId);
    records[idx] = rec;
  } else {
    records.push(rec);
  }
  save();
  renderMarkers();
  renderList();
  closeSheet();
});

document.getElementById('deleteBtn').addEventListener('click', ()=>{
  if(!editingId) return;
  if(!confirm('この調査記録を削除しますか？')) return;
  records = records.filter(r=>r.id!==editingId);
  save();
  renderMarkers();
  renderList();
  closeSheet();
});

document.getElementById('locateBtn').addEventListener('click', ()=>{
  if(!navigator.geolocation){ alert('この端末では現在地を取得できません'); return; }
  navigator.geolocation.getCurrentPosition(pos=>{
    const ll = {lat:pos.coords.latitude, lng:pos.coords.longitude};
    map.setView(ll, 17);
  }, err=>{
    alert('現在地を取得できませんでした。位置情報の許可を確認してください。');
  }, {enableHighAccuracy:true, timeout:8000});
});

// tabs
document.querySelectorAll('.tabbtn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tabbtn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const tab = btn.dataset.tab;
    document.getElementById('mapview').classList.toggle('active', tab==='map');
    document.getElementById('listview').classList.toggle('active', tab==='list');
    if(tab==='map') setTimeout(()=>map.invalidateSize(), 50);
    if(tab==='list') renderList();
  });
});

const rankLabel = {A:'良好', B:'要観察', C:'要注意', D:'危険'};
function renderList(){
  const el = document.getElementById('listContent');
  document.getElementById('countLabel').textContent = records.length + '件';
  if(records.length===0){
    el.innerHTML = '<div class="empty">まだ調査記録がありません。<br>地図タブで地点をタップして登録してください。</div>';
    return;
  }
  el.innerHTML = records.slice().reverse().map(r=>{
    const thumb = r.photo ? `style="background-image:url(${r.photo})"` : '';
    const rankChip = r.rank ? `<span class="rankchip" style="background:${ {A:'#4caf50',B:'#ffc107',C:'#ff9800',D:'#e53935'}[r.rank] }">${r.rank}: ${rankLabel[r.rank]}</span>` : '';
    const tokuteiChip = (r.tokutei && r.tokutei.overall) ? `<span class="rankchip" style="background:#b71c1c;">⚠特定空家相当</span>` : '';
    return `<div class="record" data-id="${r.id}">
      <div class="thumb" ${thumb}>${r.photo?'':'🏚'}</div>
      <div class="info">
        <div class="addr">${r.address || '（住所未入力）'}</div>
        <div class="meta">${rankChip}${tokuteiChip}${r.type||''} ${r.date?('・'+r.date):''}</div>
      </div>
    </div>`;
  }).join('');
  el.querySelectorAll('.record').forEach(div=>{
    div.addEventListener('click', ()=>{
      const rec = records.find(r=>r.id===div.dataset.id);
      openSheet({lat:rec.lat, lng:rec.lng}, rec);
    });
  });
}

document.getElementById('exportBtn').addEventListener('click', ()=>{
  if(records.length===0){ alert('出力する記録がありません'); return; }
  const headers = ['id','緯度','経度','住所','建物用途','ランク','管理状況','空き家期間','特定空家可能性（自己申告）','特定空家等チェックリスト判定','該当区分','調査日','備考'];
  const rows = records.map(r=>{
    const tk = r.tokutei;
    const tkResult = tk ? (tk.overall ? '相当あり' : '非該当') : '未実施';
    const tkCats = (tk && tk.overall) ? TOKUTEI_DATA.filter(c=>tk.catResults && tk.catResults[c.key]).map(c=>c.label).join('／') : '';
    return [r.id,r.lat,r.lng,r.address,r.type,r.rank,r.mgmt,r.period,r.special,tkResult,tkCats,r.date,r.notes];
  });
  const csv = [headers, ...rows].map(row=>row.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['﻿'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `空き家調査_${todayStr()}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

document.getElementById('clearBtn').addEventListener('click', ()=>{
  if(records.length===0) return;
  if(!confirm('全ての調査記録を削除します。よろしいですか？')) return;
  records = [];
  save();
  renderMarkers();
  renderList();
});

let pendingTokutei = null; // { answers: {"catIdx_groupIdx_itemIdx": {a:bool,b:bool}} }
let tokuteiOpenGroups = new Set(); // 開いているアコーディオンの記憶（表示中のみ）

function tk_key(ci,gi,ii){ return ci+'_'+gi+'_'+ii; }

function computeTokuteiResults(answers){
  const catResults = {};
  let overallHit = false;
  TOKUTEI_DATA.forEach((cat, ci)=>{
    let catHit = false;
    cat.groups.forEach((g, gi)=>{
      const needsTwo = g.judgeType !== 'one';
      let groupHit = false;
      g.items.forEach((_, ii)=>{
        const a = answers[tk_key(ci,gi,ii)];
        if(!a) return;
        if(needsTwo ? (a.a && a.b) : a.a) groupHit = true;
      });
      if(groupHit) catHit = true;
    });
    catResults[cat.key] = catHit;
    if(catHit) overallHit = true;
  });
  return { catResults, overall: overallHit };
}

function renderTokuteiCategories(answers){
  const wrap = document.getElementById('tokuteiCategories');
  const results = computeTokuteiResults(answers);
  wrap.innerHTML = TOKUTEI_DATA.map((cat, ci)=>{
    const hit = results.catResults[cat.key];
    const groupsHtml = cat.groups.map((g, gi)=>{
      const needsTwo = g.judgeType !== 'one';
      const itemsHtml = g.items.map((text, ii)=>{
        const k = tk_key(ci,gi,ii);
        const a = answers[k] || {a:false,b:false};
        return `<div class="tk-item">
          <div class="tk-text">${text}</div>
          <div class="tk-checks">
            <label>①<input type="checkbox" data-k="${k}" data-f="a" data-ci="${ci}" ${a.a?'checked':''}></label>
            ${needsTwo ? `<label>②<input type="checkbox" data-k="${k}" data-f="b" data-ci="${ci}" ${a.b?'checked':''}></label>` : ''}
          </div>
        </div>`;
      }).join('');
      const openCls = tokuteiOpenGroups.has(ci+'_'+gi) ? 'open' : '';
      return `<div class="tk-group">
        <div class="tk-group-head" data-toggle="${ci}_${gi}">
          <span>${g.label}${g.factor2 ? `<br><span style="font-weight:400;color:#999;">②基準：${g.factor2}</span>`:''}</span>
          <span class="chev">${openCls==='open'?'▲':'▼'}</span>
        </div>
        <div class="tk-group-body ${openCls}" id="tkgroup_${ci}_${gi}">${itemsHtml}</div>
      </div>`;
    }).join('');
    return `<div class="tk-category" data-cat="${ci}">
      <div class="tk-cat-head"><span>${cat.label}</span><span class="tk-cat-result ${hit?'hit':''}" id="tkcatresult_${ci}">${hit?'特定空家等相当':'非該当'}</span></div>
      ${groupsHtml}
    </div>`;
  }).join('');

  wrap.querySelectorAll('.tk-group-head').forEach(h=>{
    h.addEventListener('click', ()=>{
      const gkey = h.dataset.toggle;
      const body = document.getElementById('tkgroup_'+gkey);
      const chev = h.querySelector('.chev');
      const nowOpen = body.classList.toggle('open');
      chev.textContent = nowOpen ? '▲' : '▼';
      if(nowOpen) tokuteiOpenGroups.add(gkey); else tokuteiOpenGroups.delete(gkey);
    });
  });
  wrap.querySelectorAll('input[type=checkbox]').forEach(cb=>{
    cb.addEventListener('click', (e)=> e.stopPropagation());
    cb.addEventListener('change', ()=>{
      // 全体を再描画せず、該当カテゴリの判定バッジだけ更新する（チェック連打時の取りこぼし防止）
      const answers = collectTokuteiAnswers();
      const results2 = computeTokuteiResults(answers);
      TOKUTEI_DATA.forEach((cat, ci)=>{
        const badge = document.getElementById('tkcatresult_'+ci);
        if(!badge) return;
        const hit = results2.catResults[cat.key];
        badge.textContent = hit ? '特定空家等相当' : '非該当';
        badge.classList.toggle('hit', hit);
      });
    });
  });
}

function collectTokuteiAnswers(){
  const answers = {};
  document.querySelectorAll('#tokuteiCategories input[type=checkbox]').forEach(cb=>{
    const k = cb.dataset.k, f = cb.dataset.f;
    if(!answers[k]) answers[k] = {a:false,b:false};
    answers[k][f] = cb.checked;
  });
  return answers;
}

function updateTokuteiBadge(){
  const badge = document.getElementById('tokuteiSummaryBadge');
  if(!pendingTokutei || !pendingTokutei.answers || Object.keys(pendingTokutei.answers).length===0){
    badge.textContent = '未実施'; badge.className = 'tokutei-summary-badge none';
    return;
  }
  const results = computeTokuteiResults(pendingTokutei.answers);
  if(results.overall){
    const hitCats = TOKUTEI_DATA.filter(c=>results.catResults[c.key]).map(c=>c.label.split('　')[0]).join('・');
    badge.textContent = '相当あり：' + hitCats; badge.className = 'tokutei-summary-badge hit';
  } else {
    badge.textContent = '非該当'; badge.className = 'tokutei-summary-badge clear';
  }
}

document.getElementById('openTokuteiBtn').addEventListener('click', ()=>{
  tokuteiOpenGroups = new Set();
  renderTokuteiCategories((pendingTokutei && pendingTokutei.answers) || {});
  document.getElementById('tokuteiOverlay').classList.add('active');
});
function closeTokutei(){ document.getElementById('tokuteiOverlay').classList.remove('active'); }
document.getElementById('tokuteiCloseX').addEventListener('click', closeTokutei);
document.getElementById('tokuteiCancelBtn').addEventListener('click', closeTokutei);
document.getElementById('tokuteiApplyBtn').addEventListener('click', ()=>{
  const answers = collectTokuteiAnswers();
  const results = computeTokuteiResults(answers);
  pendingTokutei = { answers, catResults: results.catResults, overall: results.overall };
  updateTokuteiBadge();
  closeTokutei();
});
/* ============ /特定空家等 判定チェックリスト ============ */

initMap();
renderList();
</script>
